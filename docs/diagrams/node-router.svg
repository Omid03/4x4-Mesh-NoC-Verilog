<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">NodeRouter integration</title><desc id="desc">Local traffic generation and reception share the same handshake used by the four cardinal links.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41566d"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker>
<marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e34a33"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a9d55"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#122033} .title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526173}.box{fill:#f8fafc;stroke:#24415f;stroke-width:2}.core{fill:#e8f2ff;stroke:#1769aa;stroke-width:2}.logic{fill:#fff4df;stroke:#b06b00;stroke-width:2}.state{fill:#ecf8ef;stroke:#278149;stroke-width:2}.warn{fill:#fff0f0;stroke:#b43d3d;stroke-width:2}.wire{fill:none;stroke:#41566d;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#1769aa;stroke-width:4;marker-end:url(#arrowBlue)}.bi{fill:none;stroke:#5f4aa5;stroke-width:3;marker-start:url(#arrowPurple);marker-end:url(#arrowPurple)}.label{font-size:14px}.small{font-size:12px;fill:#526173}.gate{fill:#fff;stroke:#26384a;stroke-width:2}.mesh{fill:#edf6ff;stroke:#1769aa;stroke-width:2}.routeA{fill:none;stroke:#e34a33;stroke-width:5;marker-end:url(#arrowRed)}.routeB{fill:none;stroke:#2a9d55;stroke-width:5;marker-end:url(#arrowGreen)}.routeC{fill:none;stroke:#8b5cf6;stroke-width:5;marker-end:url(#arrowPurple)}
</style></defs>
<text x="40" y="45" class="title">NodeRouter integration</text><text x="40" y="70" class="sub">Local traffic generation and reception share the same handshake used by the four cardinal links.</text><rect x="80" y="210" width="210" height="120" rx="10" class="state"/><text x="185.0" y="264.0" text-anchor="middle" class="label" font-weight="600">Traffic Node</text><text x="185.0" y="285.0" text-anchor="middle" class="small">simulation-only source/sink</text><rect x="430" y="155" width="310" height="230" rx="10" class="core"/><text x="585.0" y="264.0" text-anchor="middle" class="label" font-weight="600">Five-port Router</text><text x="585.0" y="285.0" text-anchor="middle" class="small">L / W / N / E / S</text><path d="M290,245 L430,245" class="bus"/><text x="360.0" y="238.0" text-anchor="middle" class="small">18-bit flit + req</text><path d="M430,315 L290,315" class="wire"/><text x="360.0" y="308.0" text-anchor="middle" class="small">18-bit flit + req</text><path d="M310,285 L410,285" class="bi"/><text x="360.0" y="278.0" text-anchor="middle" class="small">ack</text><path d="M585,155 L585,95" class="bi"/><text x="585.0" y="118.0" text-anchor="middle" class="small">North</text><path d="M585,385 L585,455" class="bi"/><text x="585.0" y="413.0" text-anchor="middle" class="small">South</text><path d="M430,270 L350,270" class="bi"/><text x="390.0" y="263.0" text-anchor="middle" class="small">Local</text><path d="M740,230 L850,230" class="bi"/><text x="795.0" y="223.0" text-anchor="middle" class="small">East</text><path d="M430,345 L350,345" class="bi"/><text x="390.0" y="338.0" text-anchor="middle" class="small">West</text><rect x="815" y="190" width="150" height="80" rx="10" class="box"/><text x="890.0" y="230.0" text-anchor="middle" class="label" font-weight="600">Neighbor</text><rect x="510" y="75" width="150" height="50" rx="10" class="box"/><text x="585.0" y="100.0" text-anchor="middle" class="label" font-weight="600">Neighbor</text><rect x="510" y="435" width="150" height="50" rx="10" class="box"/><text x="585.0" y="460.0" text-anchor="middle" class="label" font-weight="600">Neighbor</text><text x="80" y="530" class="small">NodeRouter.v combines a Router instance with one local Node. The Node generates three predefined four-flit packets.</text></svg>