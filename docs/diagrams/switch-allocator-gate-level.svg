<text x="40" y="45" class="title">Switch-allocator logic</text><text x="40" y="70" class="sub">Registered requests, route comparators, a fixed-priority grant chain, and transaction locking through BusyChecker.</text><rect x="45" y="125" width="115" height="52" rx="10" class="core"/><text x="102.5" y="151.0" text-anchor="middle" class="label" font-weight="600">reqL</text><rect x="215" y="125" width="125" height="52" rx="10" class="state"/><text x="277.5" y="151.0" text-anchor="middle" class="label" font-weight="600">EN register</text><rect x="405" y="125" width="135" height="52" rx="10" class="gate"/><text x="472.5" y="151.0" text-anchor="middle" class="label" font-weight="600">route == PORT</text><path d="M160,151 L215,151" class="wire"/><path d="M340,151 L405,151" class="wire"/><rect x="45" y="205" width="115" height="52" rx="10" class="core"/><text x="102.5" y="231.0" text-anchor="middle" class="label" font-weight="600">reqW</text><rect x="215" y="205" width="125" height="52" rx="10" class="state"/><text x="277.5" y="231.0" text-anchor="middle" class="label" font-weight="600">EN register</text><rect x="405" y="205" width="135" height="52" rx="10" class="gate"/><text x="472.5" y="231.0" text-anchor="middle" class="label" font-weight="600">route == PORT</text><path d="M160,231 L215,231" class="wire"/><path d="M340,231 L405,231" class="wire"/><rect x="45" y="285" width="115" height="52" rx="10" class="core"/><text x="102.5" y="311.0" text-anchor="middle" class="label" font-weight="600">reqN</text><rect x="215" y="285" width="125" height="52" rx="10" class="state"/><text x="277.5" y="311.0" text-anchor="middle" class="label" font-weight="600">EN register</text><rect x="405" y="285" width="135" height="52" rx="10" class="gate"/><text x="472.5" y="311.0" text-anchor="middle" class="label" font-weight="600">route == PORT</text><path d="M160,311 L215,311" class="wire"/><path d="M340,311 L405,311" class="wire"/><rect x="45" y="365" width="115" height="52" rx="10" class="core"/><text x="102.5" y="391.0" text-anchor="middle" class="label" font-weight="600">reqE</text><rect x="215" y="365" width="125" height="52" rx="10" class="state"/><text x="277.5" y="391.0" text-anchor="middle" class="label" font-weight="600">EN register</text><rect x="405" y="365" width="135" height="52" rx="10" class="gate"/><text x="472.5" y="391.0" text-anchor="middle" class="label" font-weight="600">route == PORT</text><path d="M160,391 L215,391" class="wire"/><path d="M340,391 L405,391" class="wire"/><rect x="45" y="445" width="115" height="52" rx="10" class="core"/><text x="102.5" y="471.0" text-anchor="middle" class="label" font-weight="600">reqS</text><rect x="215" y="445" width="125" height="52" rx="10" class="state"/><text x="277.5" y="471.0" text-anchor="middle" class="label" font-weight="600">EN register</text><rect x="405" y="445" width="135" height="52" rx="10" class="gate"/><text x="472.5" y="471.0" text-anchor="middle" class="label" font-weight="600">route == PORT</text><path d="M160,471 L215,471" class="wire"/><path d="M340,471 L405,471" class="wire"/><rect x="650" y="165" width="220" height="310" rx="10" class="logic"/><text x="760.0" y="314.0" text-anchor="middle" class="label" font-weight="600">fixed-priority AND chain</text><text x="760.0" y="335.0" text-anchor="middle" class="small">L &gt; W &gt; N &gt; E &gt; S</text><path d="M540,151 L650,151" class="wire"/><path d="M540,231 L650,231" class="wire"/><path d="M540,311 L650,311" class="wire"/><path d="M540,391 L650,391" class="wire"/><path d="M540,471 L650,471" class="wire"/><path d="M870,205 L1015,205" class="wire"/><text x="942.5" y="198.0" text-anchor="middle" class="small">grantL</text><path d="M870,265 L1015,265" class="wire"/><text x="942.5" y="258.0" text-anchor="middle" class="small">grantW</text><path d="M870,325 L1015,325" class="wire"/><text x="942.5" y="318.0" text-anchor="middle" class="small">grantN</text><path d="M870,385 L1015,385" class="wire"/><text x="942.5" y="378.0" text-anchor="middle" class="small">grantE / grantS</text><rect x="270" y="535" width="240" height="60" rx="10" class="warn"/><text x="390.0" y="559.0" text-anchor="middle" class="label" font-weight="600">Busy OR-of-ANDs</text><text x="390.0" y="580.0" text-anchor="middle" class="small">Σ(req × grant)</text><path d="M510,565 L590,565" class="wire"/><text x="550.0" y="558.0" text-anchor="middle" class="small">busy</text><path d="M590,565 L590,90 L275,90 L275,125" class="wire"/><text x="430" y="82" class="small">~busy enables all request registers</text></svg>