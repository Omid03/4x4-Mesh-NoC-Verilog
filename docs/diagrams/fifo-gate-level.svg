<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="545" viewBox="0 0 1100 545" role="img" aria-labelledby="title desc">
<title id="title">FIFO / buffer-unit logic</title><desc id="desc">Control FSM, circular-memory datapath, status comparators, and destination extraction.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41566d"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker>
<marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e34a33"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a9d55"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#122033} .title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526173}.box{fill:#f8fafc;stroke:#24415f;stroke-width:2}.core{fill:#e8f2ff;stroke:#1769aa;stroke-width:2}.logic{fill:#fff4df;stroke:#b06b00;stroke-width:2}.state{fill:#ecf8ef;stroke:#278149;stroke-width:2}.warn{fill:#fff0f0;stroke:#b43d3d;stroke-width:2}.wire{fill:none;stroke:#41566d;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#1769aa;stroke-width:4;marker-end:url(#arrowBlue)}.bi{fill:none;stroke:#5f4aa5;stroke-width:3;marker-start:url(#arrowPurple);marker-end:url(#arrowPurple)}.label{font-size:14px}.small{font-size:12px;fill:#526173}.gate{fill:#fff;stroke:#26384a;stroke-width:2}.mesh{fill:#edf6ff;stroke:#1769aa;stroke-width:2}.routeA{fill:none;stroke:#e34a33;stroke-width:5;marker-end:url(#arrowRed)}.routeB{fill:none;stroke:#2a9d55;stroke-width:5;marker-end:url(#arrowGreen)}.routeC{fill:none;stroke:#8b5cf6;stroke-width:5;marker-end:url(#arrowPurple)}
</style></defs>
<text x="40" y="45" class="title">FIFO / buffer-unit logic</text><text x="40" y="70" class="sub">Control FSM, circular-memory datapath, status comparators, and destination extraction.</text><rect x="65" y="145" width="170" height="100" rx="10" class="logic"/><text x="150.0" y="189.0" text-anchor="middle" class="label" font-weight="600">Input handshake FSM</text><text x="150.0" y="210.0" text-anchor="middle" class="small">WRI → … → SDO</text><rect x="340" y="120" width="230" height="150" rx="10" class="state"/><text x="455.0" y="189.0" text-anchor="middle" class="label" font-weight="600">4 × 18-bit memory</text><text x="455.0" y="210.0" text-anchor="middle" class="small">data + 2-bit flit ID</text><rect x="340" y="330" width="105" height="75" rx="10" class="core"/><text x="392.5" y="361.5" text-anchor="middle" class="label" font-weight="600">write_ptr</text><text x="392.5" y="382.5" text-anchor="middle" class="small">4-bit reg</text><rect x="465" y="330" width="105" height="75" rx="10" class="core"/><text x="517.5" y="361.5" text-anchor="middle" class="label" font-weight="600">read_ptr</text><text x="517.5" y="382.5" text-anchor="middle" class="small">4-bit reg</text><rect x="605" y="185" width="120" height="75" rx="10" class="core"/><text x="665.0" y="216.5" text-anchor="middle" class="label" font-weight="600">count</text><text x="665.0" y="237.5" text-anchor="middle" class="small">5-bit reg</text><path d="M235,175 L340,175" class="wire"/><text x="287.5" y="168.0" text-anchor="middle" class="small">write_en</text><path d="M235,230 L340,230" class="wire"/><text x="287.5" y="223.0" text-anchor="middle" class="small">read_en</text><path d="M445,330 L445,270" class="wire"/><path d="M518,330 L518,270" class="wire"/><path d="M570,195 L605,220" class="wire"/><rect x="780" y="140" width="135" height="65" rx="10" class="gate"/><text x="847.5" y="172.5" text-anchor="middle" class="label" font-weight="600">== 0</text><rect x="780" y="235" width="135" height="65" rx="10" class="gate"/><text x="847.5" y="267.5" text-anchor="middle" class="label" font-weight="600">== DEPTH</text><path d="M725,220 L780,170" class="wire"/><text x="752.5" y="188.0" text-anchor="middle" class="small">count</text><path d="M725,225 L780,267" class="wire"/><text x="752.5" y="239.0" text-anchor="middle" class="small">count</text><path d="M915,172 L1010,172" class="wire"/><text x="962.5" y="165.0" text-anchor="middle" class="small">empty</text><path d="M915,267 L1010,267" class="wire"/><text x="962.5" y="260.0" text-anchor="middle" class="small">full</text><rect x="620" y="355" width="130" height="65" rx="10" class="gate"/><text x="685.0" y="381.5" text-anchor="middle" class="label" font-weight="600">ID == 01</text><text x="685.0" y="402.5" text-anchor="middle" class="small">header detect</text><rect x="820" y="350" width="150" height="75" rx="10" class="state"/><text x="895.0" y="381.5" text-anchor="middle" class="label" font-weight="600">4-bit EN register</text><text x="895.0" y="402.5" text-anchor="middle" class="small">destination</text><path d="M570,245 L620,387" class="wire"/><text x="595.0" y="309.0" text-anchor="middle" class="small">flitID[1:0]</text><path d="M750,387 L820,387" class="wire"/><text x="785.0" y="380.0" text-anchor="middle" class="small">enable</text><path d="M570,230 L820,410" class="wire"/><text x="695.0" y="313.0" text-anchor="middle" class="small">data[3:0]</text><text x="65" y="500" class="small">Logic-level view derived from fifo_datapath and fifo_control. The destination register captures bits [3:0] when a header flit (01) is observed.</text></svg>