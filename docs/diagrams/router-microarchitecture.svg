<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">Router microarchitecture</title><desc id="desc">Five buffered inputs feed one shared routing unit and five independently allocated output switches.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41566d"/></marker>
<marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1769aa"/></marker>
<marker id="arrowRed" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e34a33"/></marker>
<marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2a9d55"/></marker>
<marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/></marker>
<style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#122033} .title{font-size:28px;font-weight:700}.sub{font-size:14px;fill:#526173}.box{fill:#f8fafc;stroke:#24415f;stroke-width:2}.core{fill:#e8f2ff;stroke:#1769aa;stroke-width:2}.logic{fill:#fff4df;stroke:#b06b00;stroke-width:2}.state{fill:#ecf8ef;stroke:#278149;stroke-width:2}.warn{fill:#fff0f0;stroke:#b43d3d;stroke-width:2}.wire{fill:none;stroke:#41566d;stroke-width:2;marker-end:url(#arrow)}.bus{fill:none;stroke:#1769aa;stroke-width:4;marker-end:url(#arrowBlue)}.bi{fill:none;stroke:#5f4aa5;stroke-width:3;marker-start:url(#arrowPurple);marker-end:url(#arrowPurple)}.label{font-size:14px}.small{font-size:12px;fill:#526173}.gate{fill:#fff;stroke:#26384a;stroke-width:2}.mesh{fill:#edf6ff;stroke:#1769aa;stroke-width:2}.routeA{fill:none;stroke:#e34a33;stroke-width:5;marker-end:url(#arrowRed)}.routeB{fill:none;stroke:#2a9d55;stroke-width:5;marker-end:url(#arrowGreen)}.routeC{fill:none;stroke:#8b5cf6;stroke-width:5;marker-end:url(#arrowPurple)}
</style></defs>
<text x="40" y="45" class="title">Router microarchitecture</text><text x="40" y="70" class="sub">Five buffered inputs feed one shared routing unit and five independently allocated output switches.</text><rect x="60" y="125" width="150" height="64" rx="10" class="state"/><text x="135.0" y="151.0" text-anchor="middle" class="label" font-weight="600">Local FIFO</text><text x="135.0" y="172.0" text-anchor="middle" class="small">4 × 18-bit</text><path d="M210,157 L325,157" class="bus"/><text x="267.5" y="150.0" text-anchor="middle" class="small">flit / reqA</text><rect x="60" y="225" width="150" height="64" rx="10" class="state"/><text x="135.0" y="251.0" text-anchor="middle" class="label" font-weight="600">West FIFO</text><text x="135.0" y="272.0" text-anchor="middle" class="small">4 × 18-bit</text><path d="M210,257 L325,257" class="bus"/><text x="267.5" y="250.0" text-anchor="middle" class="small">flit / reqA</text><rect x="60" y="325" width="150" height="64" rx="10" class="state"/><text x="135.0" y="351.0" text-anchor="middle" class="label" font-weight="600">North FIFO</text><text x="135.0" y="372.0" text-anchor="middle" class="small">4 × 18-bit</text><path d="M210,357 L325,357" class="bus"/><text x="267.5" y="350.0" text-anchor="middle" class="small">flit / reqA</text><rect x="60" y="425" width="150" height="64" rx="10" class="state"/><text x="135.0" y="451.0" text-anchor="middle" class="label" font-weight="600">East FIFO</text><text x="135.0" y="472.0" text-anchor="middle" class="small">4 × 18-bit</text><path d="M210,457 L325,457" class="bus"/><text x="267.5" y="450.0" text-anchor="middle" class="small">flit / reqA</text><rect x="60" y="525" width="150" height="64" rx="10" class="state"/><text x="135.0" y="551.0" text-anchor="middle" class="label" font-weight="600">South FIFO</text><text x="135.0" y="572.0" text-anchor="middle" class="small">4 × 18-bit</text><path d="M210,557 L325,557" class="bus"/><text x="267.5" y="550.0" text-anchor="middle" class="small">flit / reqA</text><rect x="325" y="195" width="190" height="330" rx="10" class="logic"/><text x="420.0" y="354.0" text-anchor="middle" class="label" font-weight="600">Routing Unit</text><text x="420.0" y="375.0" text-anchor="middle" class="small">5 coordinate checkers</text><path d="M515,157 L635,157" class="wire"/><text x="575.0" y="150.0" text-anchor="middle" class="small">3-bit route</text><path d="M515,257 L635,257" class="wire"/><text x="575.0" y="250.0" text-anchor="middle" class="small">3-bit route</text><path d="M515,357 L635,357" class="wire"/><text x="575.0" y="350.0" text-anchor="middle" class="small">3-bit route</text><path d="M515,457 L635,457" class="wire"/><text x="575.0" y="450.0" text-anchor="middle" class="small">3-bit route</text><path d="M515,557 L635,557" class="wire"/><text x="575.0" y="550.0" text-anchor="middle" class="small">3-bit route</text><rect x="635" y="105" width="235" height="455" rx="10" class="core"/><text x="752.5" y="326.5" text-anchor="middle" class="label" font-weight="600">5×5 switch fabric</text><text x="752.5" y="347.5" text-anchor="middle" class="small">5 allocators + mux/demux</text><path d="M870,157 L1010,157" class="bus"/><text x="940.0" y="150.0" text-anchor="middle" class="small">Local output</text><path d="M870,257 L1010,257" class="bus"/><text x="940.0" y="250.0" text-anchor="middle" class="small">West output</text><path d="M870,357 L1010,357" class="bus"/><text x="940.0" y="350.0" text-anchor="middle" class="small">North output</text><path d="M870,457 L1010,457" class="bus"/><text x="940.0" y="450.0" text-anchor="middle" class="small">East output</text><path d="M870,557 L1010,557" class="bus"/><text x="940.0" y="550.0" text-anchor="middle" class="small">South output</text><path d="M135,595 L135,625 L750,625 L750,560" class="wire"/><text x="400" y="618" class="small">reqO, acknowledgements, and fixed-priority grants</text></svg>